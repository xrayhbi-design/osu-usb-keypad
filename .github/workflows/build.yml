# Builds the APK and the Windows exe in GitHub's cloud: push this folder to a GitHub repo,
# open the Actions tab, run "build" (or push), and download the "osu-keypad" artifact.
name: build
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: osu-keypad-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: host\build.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: osu-keypad-host
          path: host/OsuKeypadHost.exe
